<script>
/* =======================================================================
   KONSTANTA DASAR
   ======================================================================= */
const V3=THREE.Vector3, T=2, CH=12, CHR=2, Y=1.45;
const cx=i=>(i+.5)*T;
const key=(i,j)=>i+","+j;
const $=id=>document.getElementById(id);
const dm=new THREE.Object3D(), col=new THREE.Color();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const R=(i,j,k)=>{const s=Math.sin(i*12.9898+j*78.233+k*37.719)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),
  a=R(i,j,1),b=R(i+1,j,1),c=R(i,j+1,1),d=R(i+1,j+1,1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};

const toonGrad=(()=>{
  const c=document.createElement('canvas');c.width=5;c.height=1;
  const x=c.getContext('2d');
  const stops=['#3a3428','#6a6250','#a09880','#d0c8b0','#f8f0d8'];
  for(let i=0;i<5;i++){x.fillStyle=stops[i];x.fillRect(i,0,1,1)}
  const t=new THREE.CanvasTexture(c);
  t.minFilter=THREE.NearestFilter;t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;
  return t;
})();

const paintCanvas=(()=>{
  const c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#e8e0cc';x.fillRect(0,0,256,256);
  for(let i=0;i<600;i++){
    const w=6+Math.random()*24,h=2+Math.random()*6;
    x.save();x.translate(Math.random()*256,Math.random()*256);x.rotate((Math.random()-.5)*.7);
    const v=200+(Math.random()*55|0);
    x.fillStyle=`rgba(${v},${v-8},${v-22},.13)`;
    x.fillRect(-w/2,-h/2,w,h);x.restore();
  }
  for(let i=0;i<40;i++){
    x.fillStyle=`rgba(120,100,80,${.03+Math.random()*.04})`;
    x.beginPath();x.ellipse(Math.random()*256,Math.random()*256,
      8+Math.random()*20,4+Math.random()*8,Math.random()*3,0,7);x.fill();
  }
  return c;
})();
const paintTex=new THREE.CanvasTexture(paintCanvas);
paintTex.wrapS=paintTex.wrapT=THREE.RepeatWrapping;

const stuccoCv=(()=>{
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');x.fillStyle='#e8dcc8';x.fillRect(0,0,128,128);
  for(let i=0;i<2800;i++){
    const v=170+(Math.random()*70|0);
    x.fillStyle=`rgba(${v},${v-10},${v-25},.5)`;
    x.fillRect(Math.random()*128|0,Math.random()*128|0,1+Math.random()*2,1+Math.random()*2);
  }
  return c;
})();
const stuccoTex=new THREE.CanvasTexture(stuccoCv);
stuccoTex.wrapS=stuccoTex.wrapT=THREE.RepeatWrapping;stuccoTex.repeat.set(2,2);

const M=c=>new THREE.MeshToonMaterial({color:c,gradientMap:toonGrad,flatShading:true});
const M2=(c,r,m)=>new THREE.MeshToonMaterial({color:c,gradientMap:toonGrad,flatShading:true});
const st=c=>new THREE.MeshToonMaterial({color:c,map:stuccoTex,gradientMap:toonGrad});

const water=(i,j)=>{
  const r=10+5*Math.sin(i*.18)+4*Math.sin(i*.07+1.3);
  if(Math.abs(j-r)<1.2) return true;
  if(Math.hypot(i-18,j+14)<3) return true;
  if(Math.hypot(i+22,j-16)<2.6) return true;
  return false;
};
const biome=(i,j)=>{const t=vn(i*.15+5,j*.15+9);return t<.24?0:t<.46?1:t<.80?2:3};
const peak=(i,j)=>!water(i,j)&&!(Math.abs(i)<20&&Math.abs(j)<5)&&vn(i*.3+20,j*.3+7)>.78;

const renderer=new THREE.WebGLRenderer({canvas:$("c"),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xded8c0);
scene.fog=new THREE.Fog(0xded8c0,55,150);

const HOME=[0,0]; let zoom=.8, ang=Math.PI/4, pitch=.78, tx=HOME[0], tz=HOME[1];
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-160,320);
function fit(){
  const w=innerWidth,h=innerHeight,a=w/h,S=15/zoom;
  renderer.setSize(w,h,false);
  if(a>=1){cam.top=S;cam.bottom=-S;cam.right=S*a;cam.left=-S*a}
  else{cam.right=S;cam.left=-S;cam.top=S/a;cam.bottom=-S/a}
  cam.updateProjectionMatrix();
}
addEventListener("resize",fit);fit();

scene.add(new THREE.AmbientLight(0xd0c8b0,.28));
scene.add(new THREE.HemisphereLight(0xf8f0d8,0x6a5a40,.35));
const sun=new THREE.DirectionalLight(0xffe0b8,.90);
sun.position.set(20,32,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;sun.shadow.normalBias=.05;
Object.assign(sun.shadow.camera,{left:-46,right:46,top:46,bottom:-46,near:1,far:130});
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xe8dcc8,.16);
fill.position.set(-24,18,-16);scene.add(fill);scene.add(fill.target);

function mk(geo,mat,x,y,z,par){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;par.add(m);return m}
/* ★ say() sekarang pakai innerHTML agar bisa tampilkan FA icons */
function say(t){const m=$("msg");m.innerHTML=t;m.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>m.style.opacity=0,2800)}

const wg=new THREE.PlaneGeometry(400,400,40,40);wg.rotateX(-Math.PI/2);
const wpos=wg.attributes.position;const wcols=[];
for(let i=0;i<wpos.count;i++){
  wpos.setY(i,(Math.random()-.5)*.25);
  const t=Math.random();
  const c=new THREE.Color(0x4aa098).lerp(new THREE.Color(0x86c8b4),t);
  wcols.push(c.r,c.g,c.b);
}
wg.setAttribute('color',new THREE.Float32BufferAttribute(wcols,3));
wg.computeVertexNormals();
const wt=new THREE.Mesh(wg,new THREE.MeshToonMaterial({vertexColors:true,gradientMap:toonGrad}));
wt.receiveShadow=true;wt.position.y=.72;scene.add(wt);

const BC=[0xb8c878,0x8cb068,0x5a8850,0xe4e0c0];
const boxTop=new THREE.BoxGeometry(2.02,1.2,2.02);
const boxDirt=new THREE.BoxGeometry(2.04,.6,2.04);
const matTop=new THREE.MeshToonMaterial({color:0xffffff,map:paintTex,gradientMap:toonGrad});
const matDirt=M(0xc0a080);
const matDeco=new THREE.MeshToonMaterial({color:0xffffff,gradientMap:toonGrad,flatShading:true});
const mtnPts=[];for(let q=0;q<=6;q++){const t=q/6;mtnPts.push(new THREE.Vector2(Math.max(Math.pow(1-t,.72),.001),t))}
const DGeo={
  tr:new THREE.CylinderGeometry(.1,.14,.5,6),c1:new THREE.ConeGeometry(.7,1.1,7),
  bl:new THREE.IcosahedronGeometry(.55,0),rk:new THREE.IcosahedronGeometry(.3,0),
  fl:new THREE.SphereGeometry(.07,5,4),cc:new THREE.CylinderGeometry(.18,.2,1.1,7),
  ca:new THREE.CylinderGeometry(.09,.09,.5,6),gt:new THREE.ConeGeometry(.09,.42,4),
  mtn:new THREE.LatheGeometry(mtnPts,7),snow:new THREE.ConeGeometry(.5,1,7)
};

function deco(i,j,add){
  const b=biome(i,j),r=q=>R(i,j,q+10),o=q=>(r(q)-.5)*1.4,X=cx(i),Z=cx(j);
  const P=(n,x,y,z,sc,c,ry)=>add(n,X+x,y,Z+z,sc,c,ry);
  if(peak(i,j)){
    const h=3.4+r(1)*3.4;
    const rc=[0x9aa0a0,0xb0b8b8,0x989080,0xd8e0e0][b];
    P("mtn",0,1,0,[1.6+r(3)*.8,h,1.6+r(4)*.8],rc,r(5)*6.28);
    if(b==3||r(6)>.55) P("snow",0,1+h*.86,0,[.95,h*.3,.95],0xf4f0e0,r(7)*6.28);
    return;
  }
  const pine=(x,z,sc,cs)=>{P("tr",x,1+.25*sc,z,sc,0x7a4a2c);
    [[.85,1],[1.18,.78],[1.46,.56]].forEach(([y,s],n)=>P("c1",x,1+y*sc,z,sc*s,cs[n]))};
  const oak=(x,z,sc,n)=>{const G=[0x5a9a50,0x74b868,0x487a40];
    P("tr",x,1+.325*sc,z,[sc,sc*1.3,sc],0x7a4a2c);
    [[0,1.15,0,1],[.3,.95,.1,.66],[-.28,.9,-.12,.62],[.05,1.55,-.05,.6]]
      .forEach(([a,y,d,s],q)=>P("bl",x+a*sc,1+y*sc,z+d*sc,sc*s,G[(n+q)%3],q*1.3))};
  const K=(x,z,sc,c)=>P("rk",x,1+.14*sc,z,[sc*1.3,sc*.75,sc],c,r(x*9+3)*6);
  const F=(x,z,cs,n)=>{for(let q=0;q<n;q++){const a=q*2.4,d=.06+Math.sqrt(q)*.07;
    P("fl",x+Math.cos(a)*d,1.05,z+Math.sin(a)*d,.8+r(q+20)*.6,cs[q%cs.length])}};
  const Bs=(x,z,sc,c)=>{for(let q=0;q<5;q++){const a=q*1.26,s=sc*(q?.8:1.2);
    P("gt",x+Math.cos(a)*.09*sc,1+.21*s,z+Math.sin(a)*.09*sc,s,c)}};
  const GR=[0xb0ae9e,0x9a9690,0xc8c4b0];
  if(b==2){
    for(let q=0;q<3;q++){const x=o(q),z=o(q+3),sc=.8+r(q+6)*.5;
      r(q+9)>.35?pine(x,z,sc,[0x386a48,0x50865a,0x6aa870]):oak(x,z,sc,i+j+q)}
    if(r(14)>.5)Bs(o(15),o(16),1,0x4a8858);
    if(r(17)>.7)K(o(18),o(19),.7,GR[(i+j)%3]);
    if(r(20)>.6)F(o(21),o(22),[0xfff0d0],5);
  }else if(b==1){
    if(r(0)>.4)oak(o(1),o(2),.85,i+j);
    if(r(3)>.5)F(o(4),o(5),[0xfff0d0,0xf0e8d0],6);
    if(r(6)>.55)F(o(7),o(8),[0xffb870,0xffca8a],6);
    else if(r(6)>.3)F(o(7),o(8),[0xffb0c8,0xffe0a0,0xc8b0f0],5);
    if(r(9)>.6)Bs(o(10),o(11),1,0x4a8858);
    if(r(12)>.65){K(o(13),o(14),.9+r(15)*.5,GR[(i*j)%3]);K(o(16),o(17),.5,GR[1])}
  }else if(b==0){
    if(r(0)>.45){const x=o(1),z=o(2),sc=.8+r(3)*.5;
      P("cc",x,1+.55*sc,z,sc,0x4f9050);
      P("ca",x+.3*sc,1+.7*sc,z,sc,0x4f9050);
      P("ca",x-.3*sc,1+.55*sc,z,sc,0x4f9050)}
    if(r(4)>.5)K(o(5),o(6),.8+r(7)*.5,0xa89070);
    if(r(8)>.6)Bs(o(9),o(10),1,0xa8b070);
  }else{
    if(r(0)>.3)pine(o(1),o(2),.8+r(3)*.5,[0x6a9888,0x88b8a8,0xf0f4ec]);
    if(r(4)>.55)K(o(5),o(6),.8,0xdfe8ee);
    if(r(7)>.7)Bs(o(8),o(9),.9,0x7aa8a0);
  }
}

const chunks=new Map(),dirtyChunks=new Set();
const ckey=(a,b)=>a+","+b;
const markChunk=(i,j)=>dirtyChunks.add(ckey(Math.floor(i/CH),Math.floor(j/CH)));
function buildDeco(ch){
  ch.decoMeshes.forEach(m=>{ch.decoGroup.remove(m);m.dispose()});
  ch.decoMeshes=[];
  const lists={};
  const add=(n,x,y,z,sc,c,ry)=>{(lists[n]=lists[n]||[]).push([x,y,z,sc,c,ry||0])};
  for(let a=0;a<CH;a++)for(let b=0;b<CH;b++){
    const i=ch.ci*CH+a,j=ch.cj*CH+b;
    if(water(i,j))continue;
    if(occ.has(key(i,j))||bset.has(key(i,j)))continue;
    deco(i,j,add);
  }
  for(const n in lists){
    const L2=lists[n],geo=DGeo[n];if(!geo)continue;
    const m=new THREE.InstancedMesh(geo,matDeco,L2.length);
    m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;
    L2.forEach(([x,y,z,sc,c,ry],q)=>{
      dm.position.set(x,y,z);dm.rotation.set(0,ry,0);
      Array.isArray(sc)?dm.scale.set(sc[0],sc[1],sc[2]):dm.scale.setScalar(sc);
      dm.updateMatrix();m.setMatrixAt(q,dm.matrix);m.setColorAt(q,col.set(c));
    });
    m.instanceMatrix.needsUpdate=true;
    if(m.instanceColor)m.instanceColor.needsUpdate=true;
    ch.decoGroup.add(m);ch.decoMeshes.push(m);
  }
  ch.dirty=false;
}
function buildChunk(ci,cj){
  const group=new THREE.Group();const lands=[];
  for(let a=0;a<CH;a++)for(let b=0;b<CH;b++){
    const i=ci*CH+a,j=cj*CH+b;
    if(!water(i,j)) lands.push([i,j]);
  }
  if(lands.length){
    const top=new THREE.InstancedMesh(boxTop,matTop,lands.length);
    const dirt=new THREE.InstancedMesh(boxDirt,matDirt,lands.length);
    top.receiveShadow=true;dirt.receiveShadow=true;
    lands.forEach(([i,j],n)=>{
      dm.position.set(cx(i),.4,cx(j));dm.rotation.set(0,0,0);dm.scale.set(1,1,1);dm.updateMatrix();
      top.setMatrixAt(n,dm.matrix);
      top.setColorAt(n,col.set(BC[biome(i,j)]).offsetHSL(0,0,(R(i,j,2)-.5)*.06));
      dm.position.set(cx(i),.1,cx(j));dm.updateMatrix();
      dirt.setMatrixAt(n,dm.matrix);
    });
    top.instanceMatrix.needsUpdate=true;
    if(top.instanceColor)top.instanceColor.needsUpdate=true;
    dirt.instanceMatrix.needsUpdate=true;
    group.add(top,dirt);
  }
  const decoGroup=new THREE.Group();group.add(decoGroup);
  scene.add(group);
  const ch={ci,cj,group,decoGroup,decoMeshes:[],dirty:true};
  buildDeco(ch);return ch;
}
function disposeChunk(c){
  scene.remove(c.group);
  c.group.traverse(o=>{if(o.isInstancedMesh)o.dispose()});
  dirtyChunks.delete(ckey(c.ci,c.cj));
}
function updateChunks(budget){
  const ccx=Math.floor(tx/(CH*T)),ccz=Math.floor(tz/(CH*T));
  let built=0;
  for(let a=-CHR;a<=CHR;a++)for(let b=-CHR;b<=CHR;b++){
    const ci=ccx+a,cj=ccz+b,k=ckey(ci,cj);
    if(chunks.has(k)||built>=budget)continue;
    chunks.set(k,buildChunk(ci,cj));built++;
  }
  for(const [k,c] of chunks){
    if(Math.abs(c.ci-ccx)>CHR+1||Math.abs(c.cj-ccz)>CHR+1){disposeChunk(c);chunks.delete(k)}
  }
}

const ST=[{n:"Klasik",sl:0x8a5a38,rl:0xc4c7cf,sw:1.5},{n:"Beton",sl:0xb9bcc2,rl:0x4a5160,sw:1.8},
          {n:"Kuno",sl:0x3e2f27,rl:0xc0683a,sw:1.3},{n:"Emas",sl:0x7a2f2f,rl:0xf2c14e,sw:1.6},
          {n:"Es",sl:0x8fd3e8,rl:0xffffff,sw:1.5}];
const hx=c=>"#"+c.toString(16).padStart(6,"0");
let style=0, tool="paint", stype="desa";

function makeTrack(){return{tiles:[],pts:[],cum:[],tmid:[],L:0}}
let tracks=[makeTrack()];
let active=0;
let tiles=[],pts=[],cum=[],tmid=[],L=0;
function syncActive(){const T=tracks[active];tiles=T.tiles;pts=T.pts;cum=T.cum;tmid=T.tmid;L=T.L;}

let occ=new Set();const bset=new Set();
const MAXT=800;
const rails=new THREE.InstancedMesh(new THREE.BoxGeometry(.07,.1,1),M(0xffffff),40000);
const sleep=new THREE.InstancedMesh(new THREE.BoxGeometry(1.5,.08,.16),M(0xffffff),15000);
const bed  =new THREE.InstancedMesh(new THREE.BoxGeometry(1.6,.5,1),M(0xffffff),20000);

  m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);
  m.lookAt(b[0],b[1],b[2]);m.scale.z=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
}
function trestle(x,z,horiz){
  const t=Y-.1;
  const wd=M(0x8a5a3a),wdL=M(0xa8784a),wdD=M(0x5a3820);
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
    mk(new THREE.BoxGeometry(.18,1.3,.18),wd,x+a*.85,t-.65,z+b*.85,tg);
    mk(new THREE.BoxGeometry(.28,.1,.28),wdD,x+a*.85,t-1.3,z+b*.85,tg);
  });
  [-1,1].forEach(a=>{
    beam([x+a*.85,t-1.15,z-.85],[x+a*.85,t-.25,z+.85],.055,wdD);
    beam([x+a*.85,t-1.15,z+.85],[x+a*.85,t-.25,z-.85],.055,wdD);
    beam([x-.85,t-1.15,z+a*.85],[x+.85,t-.25,z+a*.85],.055,wdD);
    beam([x+.85,t-1.15,z+a*.85],[x-.85,t-.25,z+a*.85],.055,wdD);
    mk(new THREE.BoxGeometry(1.72,.08,.08),wdD,x,t-.7,z+a*.85,tg);
    mk(new THREE.BoxGeometry(.08,.08,1.72),wdD,x+a*.85,t-.7,z,tg);
  });
  [-1,1].forEach(a=>{
    mk(new THREE.BoxGeometry(2.0,.12,.14),wdD,x,t-.06,z+a*.85,tg);
    mk(new THREE.BoxGeometry(.14,.12,2.0),wdD,x+a*.85,t-.06,z,tg);
  });
  if(horiz){for(let i=0;i<7;i++) mk(new THREE.BoxGeometry(2.04,.1,.26),wdL,x,t,z-.9+i*.3,tg)}
  else{for(let i=0;i<7;i++) mk(new THREE.BoxGeometry(.26,.1,2.04),wdL,x-.9+i*.3,t,z,tg)}
  if(horiz){
    [-1,1].forEach(a=>{
      mk(new THREE.BoxGeometry(2.06,.07,.08),wd,x,t+.35,z+a*1.0,tg);
      mk(new THREE.BoxGeometry(2.06,.05,.06),wdD,x,t+.58,z+a*1.0,tg);
      for(let i=0;i<4;i++) mk(new THREE.BoxGeometry(.09,.68,.09),wdL,x-.9+i*.6,t+.3,z+a*1.0,tg);
    });
  }else{
    [-1,1].forEach(a=>{
      mk(new THREE.BoxGeometry(.08,.07,2.06),wd,x+a*1.0,t+.35,z,tg);
      mk(new THREE.BoxGeometry(.06,.05,2.06),wdD,x+a*1.0,t+.58,z,tg);
      for(let i=0;i<4;i++) mk(new THREE.BoxGeometry(.09,.68,.09),wdL,x+a*1.0,t+.3,z-.9+i*.6,tg);
    });
  }
  const rp=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.3,.05,16),foam);
  rp.position.set(x,.72,z);tg.add(rp);
}

function pointAt(Track,d){
  d=clamp(d,0,Track.L);
  if(Track.pts.length<2) return {x:0,z:0,tx:1,tz:0,st:0};
  let i=1;while(i<Track.pts.length-1&&Track.cum[i]<d)i++;
  const a=Track.pts[i-1],b=Track.pts[i],l=(Track.cum[i]-Track.cum[i-1])||1,f=(d-Track.cum[i-1])/l;
  return{x:a.x+(b.x-a.x)*f,z:a.z+(b.z-a.z)*f,tx:(b.x-a.x)/l,tz:(b.z-a.z)/l,st:b.st};
}

function computeTrackPoints(Tk){
  Tk.pts=[];Tk.tmid=[];
  const tt=Tk.tiles;
  if(tt.length===0){Tk.cum=[0];Tk.L=0;return}
  const D=[];
  for(let k=0;k<tt.length-1;k++)D.push([tt[k+1][0]-tt[k][0],tt[k+1][1]-tt[k][1]]);
  const din=k=>k?D[k-1]:(D[0]||[1,0]),dout=k=>k===tt.length-1?(D[D.length-1]||[1,0]):D[k];
  tt.forEach((t,k)=>{
    const a=din(k),b=dout(k),x=cx(t[0]),z=cx(t[1]),ex=x-a[0],ez=z-a[1],s0=k?1:0,w=water(t[0],t[1]);
    const P=(X,Z)=>{const v=new V3(X,0,Z);v.st=t[2];v.w=w;Tk.pts.push(v)};
    Tk.tmid.push(Tk.pts.length+4);
    if(a[0]===b[0]&&a[1]===b[1]){
      for(let n=s0;n<=8;n++)P(ex+a[0]*n/4,ez+a[1]*n/4);
    }else{
      const px=ex+b[0],pz=ez+b[1],v0=[ex-px,ez-pz],v1=[x+b[0]-px,z+b[1]-pz];
      for(let n=s0;n<=10;n++){
        const q=n/10*Math.PI/2,c=Math.cos(q),s=Math.sin(q);
        P(px+v0[0]*c+v1[0]*s,pz+v0[1]*c+v1[1]*s);
      }
    }
  });
  Tk.cum=[0];
  for(let i=1;i<Tk.pts.length;i++)Tk.cum[i]=Tk.cum[i-1]+Tk.pts[i].distanceTo(Tk.pts[i-1]);
  Tk.L=Tk.cum[Tk.cum.length-1]||0;
}

function rebuild(){
  const nw=new Set();
  tracks.forEach(Tk=>Tk.tiles.forEach(t=>nw.add(key(t[0],t[1]))));
  nw.forEach(k=>{if(!occ.has(k)){const p=k.split(",");markChunk(+p[0],+p[1])}});
  occ.forEach(k=>{if(!nw.has(k)){const p=k.split(",");markChunk(+p[0],+p[1])}});
  occ=nw;

  let railN=0,bedN=0,sleepN=0;
  tracks.forEach(Tk=>{
    computeTrackPoints(Tk);
    if(Tk.pts.length<2)return;
    for(let i=0;i<Tk.pts.length-1;i++){
      const p=Tk.pts[i],q=Tk.pts[i+1],l=p.distanceTo(q);
      const nx=-(q.z-p.z)/l,nz=(q.x-p.x)/l;
      const mx=(p.x+q.x)/2,mz=(p.z+q.z)/2;
      const stt=ST[p.st],by=p.w?Y-.22:Y-.3;
      [-.5,.5].forEach(s=>{
        if(railN>=40000)return;
        dm.position.set(mx+nx*s,Y+.12,mz+nz*s);
        dm.lookAt(q.x+nx*s,Y+.12,q.z+nz*s);
        dm.scale.set(1,1,l*1.12);dm.updateMatrix();
        rails.setMatrixAt(railN,dm.matrix);rails.setColorAt(railN++,col.set(stt.rl));
      });
      if(bedN<20000){
        dm.position.set(mx,by,mz);dm.lookAt(q.x,by,q.z);
        dm.scale.set(p.w?.3:1,p.w?.6:1,l*1.12);dm.updateMatrix();
        bed.setMatrixAt(bedN,dm.matrix);bed.setColorAt(bedN++,col.set(p.w?0x5a3420:0x9a9690));
      }
    }
    for(let d=.15;d<Tk.L;d+=.34){
      if(sleepN>=15000)break;
      const P=pointAt(Tk,d),stt=ST[P.st];
      dm.position.set(P.x,Y+.04,P.z);
      dm.lookAt(P.x+P.tx,Y+.04,P.z+P.tz);
      dm.scale.set(stt.sw/1.5,1,1);dm.updateMatrix();
      sleep.setMatrixAt(sleepN,dm.matrix);sleep.setColorAt(sleepN++,col.set(stt.sl));
    }
  });
  rails.count=railN;bed.count=bedN;sleep.count=sleepN;
  [rails,sleep,bed].forEach(o=>{o.instanceMatrix.needsUpdate=true;if(o.instanceColor)o.instanceColor.needsUpdate=true});

  while(tg.children.length)tg.remove(tg.children[0]);
  tracks.forEach(Tk=>{
    Tk.tiles.forEach((t,k)=>{
      if(!water(t[0],t[1]))return;
      const pr=Tk.tiles[k-1],nx=Tk.tiles[k+1];
      let horiz=true;
      if(pr&&nx)     horiz=Math.abs(nx[0]-pr[0])>=Math.abs(nx[1]-pr[1]);
      else if(pr)    horiz=Math.abs(t[0]-pr[0])>=Math.abs(t[1]-pr[1]);
      else if(nx)    horiz=Math.abs(t[0]-nx[0])>=Math.abs(t[1]-nx[1]);
      trestle(cx(t[0]),cx(t[1]),horiz);
    });
  });

  nb.forEach(o=>o.visible=false);
  if(tiles.length>0){
    [tiles[tiles.length-1],tiles[0]].forEach((e,q)=>{
      [[1,0],[-1,0],[0,1],[0,-1]].forEach((d,i)=>{
        const a=e[0]+d[0],b=e[1]+d[1],o=nb[q*4+i];
        if(freePaint(a,b)){o.visible=true;o.position.x=cx(a);o.position.z=cx(b)}
      });
    });
  }

  stas.forEach(st=>{
    st.ti=-1;st.d=0;st.track=null;
    for(const Tk of tracks){
      const idx=Tk.tiles.findIndex(t=>Math.abs(t[0]-st.i)+Math.abs(t[1]-st.j)===1);
      if(idx>=0){
        st.ti=idx;st.d=Tk.cum[Tk.tmid[idx]];st.track=Tk;
        st.g.rotation.y=Math.atan2(Tk.tiles[idx][0]-st.i,Tk.tiles[idx][1]-st.j);
        break;
      }
    }
  });

  for(const train of trains){
    const Tk=tracks[train.trackIdx];
    if(!Tk)continue;
    train.s=clamp(train.s,4.6,Math.max(4.6,Tk.L-4.6));
  }

  syncActive();
}

function tryMergeTracks(){
  let merged=true, didMerge=false;
  while(merged){
    merged=false;
    outer:
    for(let a=0;a<tracks.length;a++){
      for(let b=a+1;b<tracks.length;b++){
        const A=tracks[a],B=tracks[b];
        if(!A.tiles.length||!B.tiles.length)continue;
        const adj=(t1,t2)=>Math.abs(t1[0]-t2[0])+Math.abs(t1[1]-t2[1])===1;
        const aS=A.tiles[0],aE=A.tiles[A.tiles.length-1];
        const bS=B.tiles[0],bE=B.tiles[B.tiles.length-1];
        let newTiles=null,reversedA=false,reversedB=false;

        if(adj(aE,bS)){
          newTiles=A.tiles.concat(B.tiles);
        }else if(adj(aE,bE)){
          newTiles=A.tiles.concat(B.tiles.slice().reverse());
          reversedB=true;
        }else if(adj(aS,bS)){
          newTiles=A.tiles.slice().reverse().concat(B.tiles);
          reversedA=true;
        }else if(adj(aS,bE)){
          newTiles=B.tiles.concat(A.tiles);
          reversedA=true;
        }

        if(newTiles){
          A.tiles=newTiles;
          tracks.splice(b,1);
          if(active===b){active=a}
          else if(active>b){active--}

          for(const train of trains){
            if(train.trackIdx===b){
              train.trackIdx=a;
              if(reversedB){train.s=B.L-train.s;train.dir=-train.dir}
            }else if(train.trackIdx>b){
              train.trackIdx--;
            }
          }
          if(reversedA){
            for(const train of trains){
              if(train.trackIdx===a){train.s=A.L-train.s;train.dir=-train.dir}
            }
          }
          merged=true;
          didMerge=true;
          break outer;
        }
      }
    }
  }
  if(didMerge)say('<i class="fa-solid fa-link"></i> Jalur tersambung!');
}

  if(!tiles.some(t=>Math.abs(t[0]-i)+Math.abs(t[1]-j)==1))return say('<i class="fa-solid fa-circle-exclamation"></i> Taruh stasiun tepat di samping rel');

function startBuild(st){

const trains=[];
function makeTrain(trackIdx,sStart){

  const gTender=tender();parts.push({g:gTender,off:2.2});scene.add(gTender);
  const gWagon=wagon();parts.push({g:gWagon,off:3.85});scene.add(gWagon);

  wheels=saveW;rods=saveR;
  const train={trackIdx,s:sStart!==undefined?sStart:Tk.L*.5,dir:1,
    wait:0,running:true,spd:3,ph:0,
    parts,wheels:myW,rods:myR,wagons:[gWagon],
    cargo:{t:null,n:0},
    derailed:false,derailT:0,derailState:[],
    prevS:sStart!==undefined?sStart:Tk.L*.5,moving:false};

function checkCollisions(){
  for(let a=0;a<trains.length;a++){
    const A=trains[a];
    if(A.derailed)continue;
    for(let b=a+1;b<trains.length;b++){
      const B=trains[b];
      if(B.derailed)continue;
      if(A.trackIdx!==B.trackIdx)continue;
      const lenA=A.parts[A.parts.length-1].off+1.8;
      const lenB=B.parts[B.parts.length-1].off+1.8;
      const cA=A.dir>0?A.s-lenA*.5:A.s+lenA*.5;
      const cB=B.dir>0?B.s-lenB*.5:B.s+lenB*.5;
      if(Math.abs(cA-cB)<(lenA+lenB)*.5){
        const Tk=tracks[A.trackIdx];
        const midS=clamp((A.s+B.s)*.5,0,Tk.L);
        const P=pointAt(Tk,midS);
        derail(A);derail(B);spawnExplosion(P.x,2,P.z);
        if(ac)tone(1.5,.25);
        say('<i class="fa-solid fa-explosion"></i> Kereta bertabrakan!');
        break;
      }
    }
  }

const SAVE_KEY = 'kereta-mungil-save-v1';

function saveGame(){
  try{
    const state = {
      version: 1,
      tracks: tracks.map(Tk => Tk.tiles.map(t => [t[0], t[1], t[2]])),
      active: active,
      stations: stas.map(st => ({
        k: st.k, i: st.i, j: st.j,
        stock: { kayu: st.stock.kayu, batu: st.stock.batu }
      })),
      buildings: blds.filter(b => b.saveI !== undefined).map(b => ({
        i: b.saveI, j: b.saveJ, ty: b.saveTy
      })),
      trains: trains.filter(t => !t.derailed).map(t => ({
        trackIdx: t.trackIdx,
        s: t.s, dir: t.dir,
        wagonCount: t.wagons.length,
        cargo: { t: t.cargo.t, n: t.cargo.n }
      })),
      camera: { tx, tz, zoom, ang, pitch },
      allRunning: allRunning,
      spd: spd
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    say('<i class="fa-solid fa-floppy-disk"></i> Peta berhasil disimpan!');
  }catch(e){
    console.error(e);
    say('<i class="fa-solid fa-circle-xmark"></i> Gagal menyimpan: ' + e.message);
  }
}

function loadGame(){
  const json = localStorage.getItem(SAVE_KEY);
  if(!json){ say('<i class="fa-solid fa-circle-question"></i> Tidak ada save yang ditemukan'); return; }
  try{
    const state = JSON.parse(json);
    if(!state || state.version !== 1) throw new Error("Format save tidak valid");

    for(const t of trains){ t.parts.forEach(p => scene.remove(p.g)); }
    trains.length = 0;
    for(const st of stas){
      scene.remove(st.g);
      st.npcs.forEach(o => {
        scene.remove(o.g);
        const idx = npcs.indexOf(o);
        if(idx >= 0) npcs.splice(idx, 1);
      });
    }
    stas.length = 0;
    bset.clear();
    for(const b of blds){ if(b.g) scene.remove(b.g); }
    blds.length = 0;

    tracks = (state.tracks && state.tracks.length)
      ? state.tracks.map(tt => {
          const Tk = makeTrack();
          Tk.tiles = (tt || []).map(t => [t[0], t[1], t[2]]);
          return Tk;
        })
      : [makeTrack()];
    if(!tracks.length) tracks = [makeTrack()];
    active = Math.min(state.active || 0, tracks.length - 1);
    syncActive();

    (state.stations || []).forEach(sd => {
      if(!sd || sd.i === undefined) return;
      const g = stModel(sd.k);
      g.position.set(cx(sd.i), 1, cx(sd.j));
      scene.add(g);
      const st = {
        k: sd.k, i: sd.i, j: sd.j, g,
        ti: -1, d: 0, busy: false,
        stock: { kayu: (sd.stock && sd.stock.kayu) || 0,
                 batu: (sd.stock && sd.stock.batu) || 0 },
        npcs: [], job: null, timer: 2, track: null
      };
      stas.push(st);
      bset.add(key(sd.i, sd.j));
      if(sd.k === "desa"){
        npc(st, cx(sd.i) + 1.3, cx(sd.j));
        npc(st, cx(sd.i) - 1.3, cx(sd.j));
      }
    });

    (state.buildings || []).forEach(bd => {
      if(!bd || bd.i === undefined) return;
      const b = model(bd.ty || "rumah");
      b.g.position.set(cx(bd.i), 1, cx(bd.j));
      b.g.rotation.y = Math.floor(Math.random() * 4) * Math.PI / 2;
      b.saveI = bd.i; b.saveJ = bd.j; b.saveTy = bd.ty;
      setP(b, 1);
      scene.add(b.g);
      blds.push(b);
      bset.add(key(bd.i, bd.j));
    });

    rebuild();

    (state.trains || []).forEach(td => {
      if(!td || td.trackIdx >= tracks.length) return;
      const train = makeTrain(td.trackIdx, td.s);
      if(!train) return;
      train.s = td.s;
      train.dir = td.dir || 1;
      train.cargo = td.cargo || { t: null, n: 0 };
      for(let k = 1; k < (td.wagonCount || 1); k++){
        addWagonToTrain(train);
      }
    });

    if(state.camera){
      tx = state.camera.tx !== undefined ? state.camera.tx : tx;
      tz = state.camera.tz !== undefined ? state.camera.tz : tz;
      zoom = state.camera.zoom || .8;
      ang = state.camera.ang || Math.PI/4;
      pitch = state.camera.pitch || .78;
      fit();
    }

    allRunning = state.allRunning !== false;
    spd = state.spd || 3;
    $("go").innerHTML = allRunning
      ? '<i class="fa-solid fa-pause"></i>'
      : '<i class="fa-solid fa-play"></i>';

    dirtyChunks.clear();
    chunks.forEach(c => c.dirty = true);

    hud();
    say('<i class="fa-solid fa-folder-open"></i> Peta berhasil dimuat!');
  }catch(e){
    console.error(e);
    say('<i class="fa-solid fa-circle-xmark"></i> Gagal memuat: ' + e.message);
  }
}

}
function pan(dx,dy){
  const u=(cam.right-cam.left)/innerWidth,sp=Math.sin(pitch),S=Math.sin(ang),C=Math.cos(ang);
  tx=clamp(tx-S*dx*u-C*dy*u/sp,-3000,3000);
  tz=clamp(tz+C*dx*u-S*dy*u/sp,-3000,3000);
}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function route(c,sd){
  if(!c||!freePaint(c[0],c[1]))return null;
  if(tiles.length<2)return null;
  const e=sd?tiles[tiles.length-1]:tiles[0];
  const o=sd?tiles[tiles.length-2]:tiles[1];
  if(!e||!o)return null;
  let hd=D4.findIndex(d=>d[0]==e[0]-o[0]&&d[1]==e[1]-o[1]);
  if(hd<0)hd=0;
  const K2=(i,j,d)=>i+"|"+j+"|"+d;
  const gScore=new Map(),par=new Map(),done=new Set(),heap=[];
  const push=(f,k)=>{
    heap.push([f,k]);let n=heap.length-1;
    while(n>0){const p=(n-1)>>1;if(heap[p][0]<=heap[n][0])break;
      const t=heap[p];heap[p]=heap[n];heap[n]=t;n=p}
  };
  const pop=()=>{
    const top=heap[0],last=heap.pop();
    if(heap.length){
      heap[0]=last;let n=0;
      for(;;){
        const a=2*n+1,b=a+1;let m=n;
        if(a<heap.length&&heap[a][0]<heap[m][0])m=a;
        if(b<heap.length&&heap[b][0]<heap[m][0])m=b;
        if(m===n)break;
        const t=heap[m];heap[m]=heap[n];heap[n]=t;n=m;
      }
    }
    return top;
  };
  const s0=K2(e[0],e[1],hd);
  gScore.set(s0,0);
  push(Math.abs(e[0]-c[0])+Math.abs(e[1]-c[1]),s0);
  let guard=0;
  while(heap.length&&guard++<30000){
    const [,k]=pop();
    if(done.has(k))continue;
    done.add(k);
    const p=k.split("|"),i=+p[0],j=+p[1],d=+p[2];
    if(i===c[0]&&j===c[1]){
      const out=[];let cur=k;
      for(;;){
        const q=cur.split("|");out.push([+q[0],+q[1]]);
        if(!par.has(cur))break;
        cur=par.get(cur);
      }
      out.reverse();out.shift();
      return out;
    }
    const gc=gScore.get(k);
    for(let nd=0;nd<4;nd++){
      if(nd===(d^1))continue;
      const a=i+D4[nd][0],b=j+D4[nd][1];
      if(!freePaint(a,b))continue;
      const nk=K2(a,b,nd),w=gc+1+(nd!==d?.6:0);
      const old=gScore.get(nk);
      if(old===undefined||w<old){
        gScore.set(nk,w);par.set(nk,k);
        push(w+Math.abs(a-c[0])+Math.abs(b-c[1]),nk);
      }
    }
  }
  return null;
}
function best(c){
  const a=route(c,1),b=route(c,0);
  if(a&&(!b||a.length<=b.length))return [a,1];
  return b?[b,0]:[null,1];
}
function paintAt(c,max){
  if(!c)return;
  const t=tiles.find(t=>t[0]==c[0]&&t[1]==c[1]);
  if(t){ if(t[2]!=style){t[2]=style;rebuild()} return; }
  if(!tiles.length){
    if(freePaint(c[0],c[1])){ tiles.push([c[0],c[1],style]); tryMergeTracks(); rebuild(); }
    return;
  }
  if(tiles.length===1){
    const t0=tiles[0];
    const adj=Math.abs(c[0]-t0[0])+Math.abs(c[1]-t0[1])===1;
    if(adj&&freePaint(c[0],c[1])){ tiles.push([c[0],c[1],style]); tryMergeTracks(); rebuild(); }
    return;
  }
  const [r,sd]=best(c);
  if(r&&r.length<=max&&tiles.length+r.length<=MAXT)apply(r,sd);
}
function apply(r,sd){
  const Tk=tracks[active];
  const oldL=Tk.L;
  if(!sd){
    Tk.tiles.reverse();
    r.forEach(c=>Tk.tiles.push([c[0],c[1],style]));
    for(const train of trains){
      if(train.trackIdx===active){train.s=oldL-train.s;train.dir=-train.dir}
    }
  }else{
    r.forEach(c=>Tk.tiles.push([c[0],c[1],style]));
  }
  tryMergeTracks();
  rebuild();
}
function eraseAt(c){
  if(!c)return;
  const st=stas.find(t=>t.i==c[0]&&t.j==c[1]);
  if(st){removeSta(st);return}
  if(tiles.length<=6)return;
  if(same(c,tiles[tiles.length-1])){tiles.pop();rebuild()}
  else if(same(c,tiles[0])){tiles.shift();rebuild()}
}
function gs(){
  const p=[...ptrs.values()];
  pd=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])||1;
  pa=Math.atan2(p[1][1]-p[0][1],p[1][0]-p[0][0]);
  pmx=(p[0][0]+p[1][0])/2;pmy=(p[0][1]+p[1][1])/2;
}
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  showGhost(null);
  if(ptrs.size==2){act="gest";gs();return}
  if(ptrs.size>2)return;
  act=e.button==2?"orbit":(e.button==1||e.shiftKey)?"pan":tool=="view"?"orbit":tool;
  if(act=="paint")paintAt(cellAt(e),80);
  else if(act=="erase")eraseAt(cellAt(e));
  else if(act=="sta")placeSta(stype,cellAt(e));
});
cv.addEventListener("pointermove",e=>{
  const pv=ptrs.get(e.pointerId),c=cellAt(e);
  if(!pv){
    hv.visible=tool!="view"&&!!c;
    if(c){
      hv.position.x=cx(c[0]);hv.position.z=cx(c[1]);
      const ok=tool=="sta"?freeBuild(c[0],c[1]):freePaint(c[0],c[1]);
      hv.material.color.set(ok?0xffd34d:0xff6b5a);
      if(tool==="paint"&&ok){
        if(!tiles.length){ showGhost([[c[0],c[1]]]); }
        else if(tiles.length===1){
          const t0=tiles[0];
          const adj=Math.abs(c[0]-t0[0])+Math.abs(c[1]-t0[1])===1;
          showGhost(adj?[[c[0],c[1]]]:null);
        }else{ showGhost(best(c)[0]); }
      }else{ showGhost(null); }
    }else showGhost(null);
    return;
  }
  const dx=e.clientX-pv[0],dy=e.clientY-pv[1];
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(act=="gest"){
    if(ptrs.size<2)return;
    const p=[...ptrs.values()];
    const mx=(p[0][0]+p[1][0])/2,my=(p[0][1]+p[1][1])/2;
    const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])||1;
    const a=Math.atan2(p[1][1]-p[0][1],p[1][0]-p[0][0]);
    let da=a-pa;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
    zoom=clamp(zoom*d/pd,.7,3);ang-=da;fit();pan(mx-pmx,my-pmy);
    pd=d;pa=a;pmx=mx;pmy=my;
  }
  else if(act=="paint")paintAt(c,30);
  else if(act=="erase")eraseAt(c);
  else if(act=="orbit"){ang-=dx*.008;pitch=clamp(pitch+dy*.006,.35,1.35)}
  else if(act=="pan")pan(dx,dy);
});
const up=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)act=null};
addEventListener("pointerup",up);addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{zoom=clamp(zoom*(e.deltaY<0?1.1:.9),.7,3);fit()},{passive:true});

/* =======================================================================
   UI
   ======================================================================= */
function opts(){
  const o=$("opt");o.innerHTML="";
  o.style.display=tool=="paint"||tool=="sta"?"flex":"none";
  const lst=tool=="paint"
    ?ST.map((s,i)=>["<i class='dot' style='background:"+hx(s.sl)+";border-color:"+hx(s.rl)+"'></i>"+s.n,i==style,()=>{style=i;opts()}])
    :[
      ["<i class='fa-solid fa-hammer'></i> Tambang","batu",()=>{stype="batu";opts()}],
      ["<i class='fa-solid fa-tree'></i> Kayu","kayu",()=>{stype="kayu";opts()}],
      ["<i class='fa-solid fa-house'></i> Desa","desa",()=>{stype="desa";opts()}]
    ].map(([n,k,f])=>[n,k==stype,f]);
  lst.forEach(([h,on,f])=>{
    const b=document.createElement("button");
    b.innerHTML=h;b.className=on?"on":"";
    b.onclick=f;o.appendChild(b);
  });
}
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;
  document.querySelectorAll("[data-t]").forEach(x=>x.className=x==b?"on":"");
  hv.visible=false;showGhost(null);opts();
  say({
    paint:'<i class="fa-solid fa-paintbrush"></i> Seret untuk membuat rel · boleh lewati sungai · sambungkan jalur dengan menyentuhkan ujungnya',
    view:'<i class="fa-solid fa-hand-paper"></i> Seret 1 jari untuk memutar kamera',
    erase:'<i class="fa-solid fa-eraser"></i> Ketuk ujung rel atau stasiun untuk menghapus',
    sta:'<i class="fa-solid fa-building"></i> Ketuk petak kosong di samping rel'
  }[tool]);
});
$("go").onclick=()=>{
  allRunning=!allRunning;
  $("go").innerHTML = allRunning
    ? '<i class="fa-solid fa-pause"></i>'
    : '<i class="fa-solid fa-play"></i>';
};
$("spd").onclick=()=>{
  spd=spd==3?6:spd==6?1.5:3;
  const label = spd==1.5 ? "pelan" : spd==3 ? "normal" : "cepat";
  const icon = spd==1.5 ? "fa-person-walking" : spd==3 ? "fa-person-running" : "fa-bolt";
  say('<i class="fa-solid '+icon+'"></i> Kecepatan '+label);
};
$("wg").onclick=()=>{
  if(!trains.length){say('<i class="fa-solid fa-circle-exclamation"></i> Tambah kereta dulu');return}
  const anyMax=trains.some(t=>t.wagons.length>=6);
  if(anyMax){
    trains.forEach(t=>{
      while(t.wagons.length>1){
        const w=t.wagons.pop();
        scene.remove(w.g);
        const i=t.parts.findIndex(p=>p.g===w);
        if(i>=0)t.parts.splice(i,1);
      }
    });
    say('<i class="fa-solid fa-train-subway"></i> Gerbong dikembalikan jadi 1');
  }else{
    trains.forEach(t=>addWagonToTrain(t));
    say('<i class="fa-solid fa-train-subway"></i> Gerbong: '+trains[0].wagons.length);
  }
  hud();
};
$("tr").onclick=()=>{
  const Tk=tracks[active];
  if(!Tk||!Tk.tiles.length){
    say('<i class="fa-solid fa-circle-exclamation"></i> Track kosong — gambar rel dulu');return;
  }
  if(trains.length>=6){
    say('<i class="fa-solid fa-circle-exclamation"></i> Maksimal 6 kereta');return;
  }
  makeTrain(active,Tk.L*.5);
  say('<i class="fa-solid fa-train"></i> Kereta '+trains.length+' ditambahkan');hud();
};
$("tk").onclick=()=>{
  if(active===tracks.length-1&&tracks.length<3){
    tracks.push(makeTrack());
    active=tracks.length-1;
    syncActive();rebuild();
    say('<i class="fa-solid fa-code-branch"></i> Track '+(active+1)+' dibuat — klik di peta untuk mulai menggambar');
  }else{
    active=(active+1)%tracks.length;
    syncActive();rebuild();
    const Tk=tracks[active];
    if(!Tk.tiles.length){
      say('<i class="fa-solid fa-code-branch"></i> Track '+(active+1)+'/'+tracks.length+' (kosong — klik di peta)');
    }else{
      say('<i class="fa-solid fa-code-branch"></i> Track '+(active+1)+'/'+tracks.length+' ('+Tk.tiles.length+' rel)');
    }
  }
  hud();
};
$("sv").onclick = saveGame;
$("ld").onclick = loadGame;
$("min").onclick = () => {
  const colPanel = $("col");
  const icon = $("min").querySelector("i");
  const isHidden = colPanel.classList.toggle("hidden");
  icon.className = isHidden
    ? "fa-solid fa-chevron-left"
    : "fa-solid fa-chevron-right";
  $("min").title = isHidden ? "Tampilkan panel" : "Sembunyikan panel";
};
$("rc").onclick=()=>{ang=Math.PI/4;pitch=.78;tx=HOME[0];tz=HOME[1];zoom=.8;fit()};
opts();

let ac;
function tone(len,vol){
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime,g=ac.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.05);
    g.gain.linearRampToValueAtTime(0,t+len);g.connect(ac.destination);
    [520,660].forEach(f=>{
      const o=ac.createOscillator();o.type="triangle";o.frequency.value=f;
      o.connect(g);o.start(t);o.stop(t+len+.05);
    });
  }catch(e){}
}

/* INIT */
let allRunning=true, spd=3;
function init(){
  const Tk=tracks[0];
  Tk.tiles=[];
  for(let i=-12;i<=12;i++)Tk.tiles.push([i,0,0]);
  syncActive();
  rebuild();
  makeTrain(0,0);
  trains[0].s=tracks[0].L*.5;
  placeSta("batu",[-9,-1]);
  placeSta("kayu",[0,1]);
  placeSta("desa",[9,-1]);
  hud();
}

/* LOOP */
const clock=new THREE.Clock(),tmp=new V3();
let acc=0,chunkTick=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const r=34,cp=Math.cos(pitch);
  cam.position.set(tx+Math.cos(ang)*r*cp,1+Math.sin(pitch)*r,tz+Math.sin(ang)*r*cp);
  cam.lookAt(tx,1,tz);
  sun.position.set(tx+28,32,tz+14);sun.target.position.set(tx,0,tz);sun.target.updateMatrixWorld();
  fill.position.set(tx-24,18,tz-16);fill.target.position.set(tx,0,tz);fill.target.updateMatrixWorld();
  wt.position.set(Math.round(tx/40)*40,.72,Math.round(tz/40)*40);
  chunkTick+=dt;
  if(chunkTick>.1){chunkTick=0;updateChunks(3)}
  dirtyChunks.forEach(k=>{const c=chunks.get(k);if(c)c.dirty=true});
  dirtyChunks.clear();
  chunks.forEach(c=>{if(c.dirty)buildDeco(c)});

  for(let ti=trains.length-1;ti>=0;ti--){
    const train=trains[ti];
    const Tk=tracks[train.trackIdx];
    if(!Tk){continue}
    if(train.derailed){
      train.derailT+=dt;
      train.parts.forEach((p,idx)=>{
        const st=train.derailState[idx];
        if(!st)return;
        st.vel.y-=12*dt;p.g.position.addScaledVector(st.vel,dt);
        p.g.rotation.x+=st.angVel.x*dt;p.g.rotation.y+=st.angVel.y*dt;p.g.rotation.z+=st.angVel.z*dt;
        if(p.g.position.y<0.55){
          p.g.position.y=0.55;st.vel.set(0,0,0);st.angVel.multiplyScalar(.6);
          if(st.angVel.length()<0.05)st.angVel.set(0,0,0);
        }
      });
      if(train.derailT>8){train.parts.forEach(p=>scene.remove(p.g));trains.splice(ti,1)}
      continue;
    }
    train.s=clamp(train.s,4.6,Math.max(4.6,Tk.L-4.6));
    const lo=4.6,hi=Math.max(lo,Tk.L-4.6);
    let moving=false;train.moving=false;
    if(allRunning&&train.running){
      if(train.wait>0)train.wait-=dt;
      else if(train.dir>0&&train.s>=hi-.01){train.dir=-1;train.wait=1;if(ac)tone(.8,.12)}
      else if(train.dir<0&&train.s<=lo+.01){train.dir=1;train.wait=1;if(ac)tone(.8,.12)}
      else{
        const ps=train.s;
        train.s=clamp(train.s+train.dir*spd*dt,lo,hi);
        moving=true;train.moving=true;train.prevS=ps;
        stas.forEach(st=>{
          if(st.ti<0||st.track!==Tk)return;
          if(!st.busy&&(ps-st.d)*(train.s-st.d)<=0&&ps!==train.s){
            train.s=st.d;train.wait=2.2;st.busy=true;moving=false;train.moving=false;
            service(st,train);if(ac)tone(.3,.08);
          }
        });
      }
    }
    train.parts.forEach(p=>{
      const d=clamp(train.s-train.dir*p.off,0,Tk.L);
      const P=pointAt(Tk,d);
      p.g.position.set(P.x,Y+.14,P.z);
      p.g.rotation.y=Math.atan2(P.tx*train.dir,P.tz*train.dir);
    });
    if(moving){
      train.wheels.forEach(w=>w.w.rotation.x+=spd*dt/w.r);
      train.ph+=spd*dt/.3;
      train.rods.forEach((rd,i)=>{
        rd.position.y=.3-.1*Math.sin(train.ph+i*1.57);
        rd.position.z=.28+.1*Math.cos(train.ph+i*1.57);
      });
    }
    train.parts[0].g.updateMatrixWorld(true);
    acc+=dt;
    if(moving&&acc>.16){
      acc=0;
      const p=puffs.find(q=>q.userData.life>=q.userData.max);
      if(p){
        tmp.set(0,2,1.05);train.parts[0].g.localToWorld(tmp);
        p.position.copy(tmp);
        p.userData={life:0,max:1.9,dx:(Math.random()-.5)*.4};
        p.visible=true;
      }
    }
  }

  checkCollisions();

  stas.forEach(st=>{
    if(st.ti<0)return;
    let anyNear=false;
    for(const train of trains){
      if(train.derailed)continue;
      const Tk=tracks[train.trackIdx];
      if(!Tk||st.track!==Tk)continue;
      if(Math.abs(train.s-st.d)<3){anyNear=true;break}
    }
    if(!anyNear)st.busy=false;
  });

  updateExplosions(dt);
  puffs.forEach(p=>{
    const u=p.userData;
    if(u.life>=u.max){p.visible=false;return}
    u.life+=dt;p.position.y+=1.3*dt;p.position.x+=u.dx*dt;
    p.scale.setScalar(.3+u.life*.7);p.material.opacity=.95*(1-u.life/u.max);
  });
  nb.forEach(m=>m.material.opacity=.4+.2*Math.sin(t*4));

  stas.forEach(st=>{
    if(st.k!="desa")return;
    if(st.job){
      const j=st.job,near=st.npcs.filter(o=>o.at).length;
      if(near){
        j.p+=dt*near/8;setP(j.b,Math.min(1,j.p));
        if(j.p>=1){
          blds.push(j.b);st.job=null;st.npcs.forEach(o=>{o.job=null;o.w=.5});
          st.timer=3;
          say('<i class="fa-solid fa-house"></i> '+j.ty[0].toUpperCase()+j.ty.slice(1)+' baru selesai!');
          if(j.ty=="rumah"&&npcs.length<20)npc(st,cx(j.i),cx(j.j)+1.2);
          hud();
        }
      }
    }else{
      st.timer-=dt;if(st.timer<0){st.timer=3;startBuild(st)}
    }
  });
  blds.forEach(b=>{if(b.bl)b.bl.rotation.z+=dt*1.3});
  npcs.forEach(o=>{
    const dx=o.tx-o.g.position.x,dz=o.tz-o.g.position.z,d=Math.hypot(dx,dz);
    if(d>.08){
      const v=Math.min(d,1.6*dt);
      o.g.position.x+=dx/d*v;o.g.position.z+=dz/d*v;
      o.g.rotation.y=Math.atan2(dx,dz);o.at=false;
      o.ph+=dt*11;o.g.position.y=1+Math.abs(Math.sin(o.ph))*.045;
    }else{
      o.at=true;o.g.position.y=1;
      if(o.job)o.g.position.y=1+Math.abs(Math.sin(t*14))*.08;
      else{
        o.w-=dt;
        if(o.w<0){
          o.w=2+Math.random()*3;
          for(let q=0;q<5;q++){
            const x=cx(o.st.i)+(Math.random()-.5)*6;
            const z=cx(o.st.j)+(Math.random()-.5)*6;
            if(!water(...tileOf(x,z))&&!peak(...tileOf(x,z))){o.tx=x;o.tz=z;break}
          }
        }
      }
    }
    const walk=d>.08;
    const sw=walk?Math.sin(o.ph)*.6:0;
    o.l1.rotation.x=sw;o.l2.rotation.x=-sw;
    o.a1.rotation.x=-sw*.8;o.a2.rotation.x=sw*.8;
  });

  renderer.render(scene,cam);
}
fit();updateChunks(99);init();frame();
</script></body></html>
